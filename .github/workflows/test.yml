name: tests

# Fast suite on every push to main and on pull requests; slow suite on version tags and on demand
# (Actions tab → tests → Run workflow, pick "slow").
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [fast, slow]
        default: slow

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Git identity for test repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Run tests
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then suite="${{ inputs.suite }}";
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then suite=slow;
          else suite=fast; fi
          echo "suite: $suite"
          set +e
          node dwmt/test/run.mjs "$suite" 2>&1 | tee test-output.txt
          rc=${PIPESTATUS[0]}
          # The run page summary is public (job logs need sign-in): result line per file, then red-file tails.
          {
            echo "## $suite suite"
            echo '```'
            grep -E '^(ok|not ok) [0-9]+ - |^# files:' test-output.txt
            echo '```'
            if [ "$rc" -ne 0 ]; then
              echo '<details><summary>Red files: output</summary>'
              echo
              echo '```'
              awk '/^# red /{p=1} p' test-output.txt | head -c 200000
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are visible without sign-in: one per red file, with its first failing tests.
          awk '/^# --- /{f=$3; n=0} /^# ✖ / && f && n<2 && !/failing tests/ {sub(/^# ✖ /, ""); print f ": " $0; n++}' test-output.txt \
            | head -n 10 | while IFS= read -r l; do echo "::error title=red test::$l"; done
          exit "$rc"
