<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 004 — historia i koszty</title>
<link rel="stylesheet" href="../themes/default.css">
<link rel="stylesheet" href="../shared/app.css">
<link rel="stylesheet" href="../shared/board.css">
<style>
.filters { display: flex; gap: var(--space-2); align-items: center; margin-top: var(--space-3); font-size: var(--text-sm); }
.seg { display: inline-flex; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
.seg button { border: 0; background: none; padding: 4px 12px; cursor: pointer; font-size: var(--text-sm); color: var(--color-text-muted); transition: all .15s; }
.seg button + button { border-left: 1px solid var(--color-border); }
.seg button:hover { background: var(--color-hover); }
.seg button.on { background: var(--color-primary-bg); color: var(--color-primary); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-top: var(--space-3); }
@media (max-width: 900px) { .kpis { grid-template-columns: 1fr 1fr; } }
.kpi { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); }
.kpi .label { font-size: var(--text-sm); color: var(--color-text-muted); }
.kpi .value { font-size: var(--text-2xl); font-weight: 600; margin-top: 2px; }
.kpi .sub { font-size: var(--text-sm); color: var(--color-text-subtle); margin-top: 2px; }
.card2 { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); margin-top: var(--space-3); }
.card2 h3 { margin: 0; padding: var(--space-3) var(--space-4) 0; font-size: var(--text-md); font-weight: 600; }
.card2 .sub { padding: 2px var(--space-4) 0; font-size: var(--text-sm); color: var(--color-text-muted); }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
@media (max-width: 1000px) { .charts { grid-template-columns: 1fr; } }
.chart { padding: var(--space-2) var(--space-3) var(--space-3); }
svg.viz { display: block; width: 100%; overflow: visible; }
svg.viz text { fill: var(--color-text-muted); font-size: 11px; font-family: var(--font-sans); }
svg.viz text.val { fill: var(--color-text); font-weight: 600; }
svg.viz .grid line { stroke: var(--color-border); stroke-width: 1; }
svg.viz .bar { fill: var(--viz-1); transition: opacity .15s; }
svg.viz .hit { fill: transparent; cursor: pointer; }
svg.viz .hit:hover + .bar, svg.viz g.col:hover .bar { opacity: .75; }
svg.viz .line { fill: none; stroke: var(--viz-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.viz .dot { fill: var(--viz-1); stroke: var(--color-surface); stroke-width: 2; }
svg.viz .median { stroke: var(--color-text-subtle); stroke-width: 1; }
svg.viz .band { fill: var(--viz-band); }
svg.viz .cross { stroke: var(--color-text-subtle); stroke-width: 1; opacity: 0; }
svg.viz g.col:hover .cross { opacity: 1; }
.legend-line { display: flex; gap: var(--space-4); padding: 0 var(--space-4) var(--space-3); font-size: var(--text-sm); color: var(--color-text-muted); flex-wrap: wrap; }
.legend-line i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.fit { white-space: nowrap; font-size: var(--text-sm); }
.fit .ic { font-weight: 700; margin-right: 3px; }
.fit.in .ic { color: var(--color-success); }
.fit.above .ic { color: var(--st-done); }
.fit.below .ic { color: var(--color-text-subtle); }
#ttip { position: fixed; z-index: 400; pointer-events: none; background: var(--color-surface); border: 1px solid var(--color-border); box-shadow: var(--shadow-md);
  border-radius: var(--radius-md); padding: 6px 10px; font-size: var(--text-sm); display: none; min-width: 140px; }
#ttip .v { font-weight: 700; font-size: var(--text-md); color: var(--color-text); }
#ttip .l { color: var(--color-text-muted); }
table.grid { width: 100%; border-collapse: collapse; }
table.grid th { text-align: left; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-muted); font-weight: 600; padding: 6px 10px;
  border-bottom: 1px solid var(--color-border); background: var(--color-surface-2); white-space: nowrap; }
table.grid th.r, table.grid td.r { text-align: right; }
table.grid td { padding: 6px 10px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
table.grid tbody tr { cursor: pointer; transition: background .15s; }
table.grid tbody tr:hover { background: var(--color-hover); }
td.num, .num { font-variant-numeric: tabular-nums; }
.tbar { display: flex; align-items: center; gap: 8px; min-width: 180px; }
.tbar .b { height: 8px; background: var(--viz-1); border-radius: 0 4px 4px 0; }
.mini-range { position: relative; width: 120px; height: 12px; display: inline-block; vertical-align: middle; margin-right: 8px; }
.mini-range .bd { position: absolute; top: 3px; height: 6px; background: var(--viz-band); border-radius: 3px; }
.mini-range .dt { position: absolute; top: 1px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border: 2px solid var(--color-surface); box-sizing: border-box; }
.dt.in { background: var(--color-text); } .dt.above { background: var(--st-done); } .dt.below { background: var(--color-text-subtle); }
details.older { margin-top: var(--space-3); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
details.older summary { padding: var(--space-2) var(--space-4); cursor: pointer; color: var(--color-text-muted); font-size: var(--text-sm); }
details.older .rows { padding: 0 var(--space-4) var(--space-3); columns: 2; font-size: var(--text-sm); }
details.older .rows div { break-inside: avoid; padding: 2px 0; }
.tbl-toggle { margin-top: var(--space-3); }
</style>
</head>
<body>
<script src="../data/data.js"></script>
<script src="../data/pl.js"></script>
<script src="../data/human.js"></script>
<script src="../shared/app.js"></script>
<script src="../shared/board.js"></script>
<script>
const { esc, t } = App;
App.extendT({
  r_14: '14 dni', r_30: '30 dni', r_all: 'Wszystko z pomiarem', range: 'Okres:',
  k_sprints: 'Zamknięte sprinty', k_tokens: 'Tokeny razem', k_perFile: 'Koszt na zmieniony plik', k_fit: 'Cena startu trafiona', k_median: 'mediana', k_files: '{n} zmienionych plików',
  k_fitSub: '{a} powyżej, {b} poniżej', k_noEst: 'brak cen startu',
  c_merged: 'Scalony', c_sprint: 'Sprint', c_kind: 'Rodzaj', c_files: 'Pliki', c_tokens: 'Tokeny', c_perFile: 'Na plik (mln)', c_fit: 'Cena startu → wynik', c_review: 'Przegląd',
  fit_in: 'w przedziale', fit_above: 'powyżej', fit_below: 'poniżej', rv_pending: 'czeka', 'rv_n/a': 'nie dotyczy', rv_accepted: 'przyjęty',
  ch1: 'Tokeny na sprint', ch1s: 'każdy słupek to jeden scalony sprint, w kolejności scalania', ch2: 'Koszt na zmieniony plik', ch2s: 'mln tokenów na plik; linia pozioma = mediana okresu',
  ch3: 'Cena startu a wynik', ch3s: 'pasek = cena podana na starcie (min–maks), kropka = faktyczny koszt', lg_band: 'cena startu', lg_in: 'wynik w przedziale', lg_above: 'powyżej (znak ▲)', lg_below: 'poniżej (znak ▼)',
  showTable: 'Pokaż tabelę', hideTable: 'Ukryj tabelę', older: 'Wcześniejsze sprinty bez pomiaru ({n})', median: 'mediana {v}', perFileShort: '{v} / plik',
}, {
  r_14: '14 days', r_30: '30 days', r_all: 'All measured', range: 'Period:',
  k_sprints: 'Sprints closed', k_tokens: 'Tokens total', k_perFile: 'Cost per changed file', k_fit: 'Start price hit', k_median: 'median', k_files: '{n} changed files',
  k_fitSub: '{a} above, {b} below', k_noEst: 'no start prices',
  c_merged: 'Merged', c_sprint: 'Sprint', c_kind: 'Kind', c_files: 'Files', c_tokens: 'Tokens', c_perFile: 'Per file (M)', c_fit: 'Start price → actual', c_review: 'Review',
  fit_in: 'within', fit_above: 'above', fit_below: 'below', rv_pending: 'waiting', 'rv_n/a': 'n/a', rv_accepted: 'accepted',
  ch1: 'Tokens per sprint', ch1s: 'each column is one merged sprint, in merge order', ch2: 'Cost per changed file', ch2s: 'M tokens per file; horizontal line = period median',
  ch3: 'Start price vs actual', ch3s: 'bar = start price (min–max), dot = actual cost', lg_band: 'start price', lg_in: 'actual within', lg_above: 'above (▲)', lg_below: 'below (▼)',
  showTable: 'Show table', hideTable: 'Hide table', older: 'Earlier sprints without measurement ({n})', median: 'median {v}', perFileShort: '{v} / file',
});

const u = { range: 'all', table: false };
const today = App.D.generatedAt.slice(0, 10);
const measured = () => App.closedSorted().filter((a) => a.tokensM != null && a.files)
  .filter((a) => u.range === 'all' || App.daysAgo(a.merged) <= +u.range)
  .map((a) => ({ ...a, perFile: a.tokensM / a.files, rg: App.estRange(a.est) }))
  .sort((x, y) => x.merged.localeCompare(y.merged) || x.id.localeCompare(y.id));
const fit = (r) => (!r.rg ? null : r.tokensM > r.rg[1] ? 'above' : r.tokensM < r.rg[0] ? 'below' : 'in');
const FIT_IC = { in: '✓', above: '▲', below: '▼' };
const median = (xs) => { const s = xs.slice().sort((a, b) => a - b); const m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null; };
const fitHtml = (r) => { const f = fit(r); return f ? `<span class="fit ${f}"><span class="ic">${FIT_IC[f]}</span>${t('fit_' + f)}</span>` : '<span class="subtle">—</span>'; };

function filters() {
  return `<div class="filters"><span class="muted">${t('range')}</span><div class="seg">${['14', '30', 'all'].map((r) => `<button class="${u.range === r ? 'on' : ''}" onclick="u.range='${r}';App.render();App.selectVariant(App.active)">${t('r_' + r)}</button>`).join('')}</div></div>`;
}
function kpis(rows) {
  const tok = rows.reduce((s, r) => s + r.tokensM, 0), files = rows.reduce((s, r) => s + r.files, 0);
  const withEst = rows.filter((r) => r.rg), inN = withEst.filter((r) => fit(r) === 'in').length;
  return `<div class="kpis">
    <div class="kpi"><div class="label">${t('k_sprints')}</div><div class="value">${rows.length}</div><div class="sub">${t('k_files', { n: files })}</div></div>
    <div class="kpi"><div class="label">${t('k_tokens')}</div><div class="value">${App.fmtM(tok)}</div><div class="sub">${App.fmtDate(rows[0] ? rows[0].merged : '')} – ${App.fmtDate(today)}</div></div>
    <div class="kpi"><div class="label">${t('k_perFile')}</div><div class="value">${App.fmtM(median(rows.map((r) => r.perFile)))}</div><div class="sub">${t('k_median')}</div></div>
    <div class="kpi"><div class="label">${t('k_fit')}</div><div class="value">${withEst.length ? `${inN} / ${withEst.length}` : '—'}</div>
      <div class="sub">${withEst.length ? t('k_fitSub', { a: withEst.filter((r) => fit(r) === 'above').length, b: withEst.filter((r) => fit(r) === 'below').length }) : t('k_noEst')}</div></div>
  </div>`;
}
function table(rows) {
  const max = Math.max(...rows.map((r) => r.tokensM), 1);
  const rmax = Math.max(...rows.map((r) => Math.max(r.tokensM, r.rg ? r.rg[1] : 0)), 1);
  return `<div class="card2" style="overflow:auto"><table class="grid"><thead><tr><th>${t('c_merged')}</th><th>${t('c_sprint')}</th><th>${t('c_kind')}</th><th class="r">${t('c_files')}</th>
    <th>${t('c_tokens')}</th><th class="r">${t('c_perFile')}</th><th>${t('c_fit')}</th><th>${t('c_review')}</th></tr></thead><tbody>
    ${rows.slice().reverse().map((r) => { const f = fit(r);
      return `<tr data-open="${esc(r.id)}"><td class="subtle">${App.fmtDate(r.merged)}</td><td><span class="id">${esc(r.id)}</span> ${esc(App.htitle(r.id, r.goal))}</td>
      <td>${r.kind ? App.kind(r.kind) : ''}</td><td class="r num">${r.files}</td>
      <td><div class="tbar"><div class="b" style="width:${(r.tokensM / max) * 120}px"></div><span class="num">${App.fmtM(r.tokensM)}</span></div></td>
      <td class="r num">${App.fmtN(Math.round(r.perFile * 1000) / 1000)}</td>
      <td>${r.rg ? `<span class="mini-range"><span class="bd" style="left:${(r.rg[0] / rmax) * 100}%;width:${((r.rg[1] - r.rg[0]) / rmax) * 100}%"></span><span class="dt ${f}" style="left:${(r.tokensM / rmax) * 100}%"></span></span>` : ''}${fitHtml(r)}</td>
      <td class="subtle">${r.uat ? esc(t('rv_' + r.uat)) : '—'}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function older() {
  const o = App.archive.filter((a) => a.tokensM == null && !a.dropped);
  return `<details class="older"><summary>${t('older', { n: o.length })}</summary><div class="rows">${o.map((a) => `<div><span class="id">${esc(a.id)}</span> ${esc(App.goal(a.id, a.goal))} <span class="subtle">${a.merged ? App.fmtDate(a.merged) : ''}</span></div>`).join('')}</div></details>`;
}

/* ---------- A ---------- */
function renderA() {
  const rows = measured();
  return `<div class="page">${filters()}${kpis(rows)}${table(rows)}${older()}</div>`;
}

/* ---------- B ---------- */
function renderB() {
  const rows = measured();
  return `<div class="page">${filters()}${kpis(rows)}
    <div class="charts">
      <div class="card2"><h3>${t('ch1')}</h3><div class="sub">${t('ch1s')}</div><div class="chart" id="ch1"></div></div>
      <div class="card2"><h3>${t('ch2')}</h3><div class="sub">${t('ch2s')}</div><div class="chart" id="ch2"></div></div>
    </div>
    <div class="card2"><h3>${t('ch3')}</h3><div class="sub">${t('ch3s')}</div><div class="chart" id="ch3"></div>
      <div class="legend-line"><span><i style="width:22px;height:8px;border-radius:4px;background:var(--viz-band)"></i>${t('lg_band')}</span>
      <span><i style="width:10px;height:10px;border-radius:50%;background:var(--color-text)"></i>✓ ${t('lg_in')}</span>
      <span><i style="width:10px;height:10px;border-radius:50%;background:var(--st-done)"></i>${t('lg_above')}</span>
      <span><i style="width:10px;height:10px;border-radius:50%;background:var(--color-text-subtle)"></i>${t('lg_below')}</span></div></div>
    <div class="tbl-toggle"><button class="link-btn" onclick="u.table=!u.table;App.render();App.selectVariant('b')">${u.table ? t('hideTable') : t('showTable')}</button></div>
    ${u.table ? table(rows) : ''}${older()}</div>`;
}
const niceMax = (v) => { const steps = [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100]; const s = steps.find((x) => v / x <= 5) || 100; return { max: Math.ceil(v / s) * s, step: s }; };
function yGrid(W, H, pad, scale, fmt) {
  let g = '<g class="grid">';
  for (let v = 0; v <= scale.max + 1e-9; v += scale.step) { const y = pad.t + (H - pad.t - pad.b) * (1 - v / scale.max);
    g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}"/><text x="${pad.l - 6}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`; }
  return g + '</g>';
}
const tipData = (r) => [[App.fmtM(r.tokensM), App.htitle(r.id, r.goal)], [App.fmtDate(r.merged) + ' · ' + r.files + ' ' + t('filesN'), ''], [t('perFileShort', { v: App.fmtN(Math.round(r.perFile * 1000) / 1000) }), '']];
function columnsChart(el, rows) {
  const W = Math.max(el.clientWidth, 360), H = 220, pad = { l: 40, r: 8, t: 16, b: 28 };
  const sc = niceMax(Math.max(...rows.map((r) => r.tokensM), 1)), slot = (W - pad.l - pad.r) / rows.length, bw = Math.min(24, slot * 0.7);
  const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / sc.max), maxR = rows.reduce((a, b) => (b.tokensM > a.tokensM ? b : a), rows[0]);
  let s = `<svg class="viz" height="${H}" viewBox="0 0 ${W} ${H}">${yGrid(W, H, pad, sc, (v) => App.fmtN(v))}`;
  rows.forEach((r, i) => { const x = pad.l + slot * i + (slot - bw) / 2, top = y(r.tokensM), h = H - pad.b - top;
    s += `<g class="col" data-open="${esc(r.id)}" data-tip="${esc(JSON.stringify(tipData(r)))}"><rect class="hit" x="${pad.l + slot * i}" y="${pad.t}" width="${slot}" height="${H - pad.t - pad.b}"/>
      <path class="bar" d="M${x},${H - pad.b} V${top + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${H - pad.b} Z"/></g>`;
    if (r === maxR) s += `<text class="val" x="${x + bw / 2}" y="${top - 4}" text-anchor="middle">${App.fmtN(r.tokensM)}</text>`;
    if (i === 0 || i === rows.length - 1 || i % Math.ceil(rows.length / 6) === 0) s += `<text x="${pad.l + slot * i + slot / 2}" y="${H - 8}" text-anchor="middle">${App.fmtDate(r.merged)}</text>`; });
  el.innerHTML = s + `<line x1="${pad.l}" x2="${W - pad.r}" y1="${H - pad.b}" y2="${H - pad.b}" style="stroke:var(--color-border-strong)"/></svg>`;
}
function lineChart(el, rows) {
  const W = Math.max(el.clientWidth, 360), H = 220, pad = { l: 40, r: 64, t: 16, b: 28 };
  const sc = niceMax(Math.max(...rows.map((r) => r.perFile), 0.1)), slot = (W - pad.l - pad.r) / rows.length;
  const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / sc.max), x = (i) => pad.l + slot * i + slot / 2, med = median(rows.map((r) => r.perFile));
  let s = `<svg class="viz" height="${H}" viewBox="0 0 ${W} ${H}">${yGrid(W, H, pad, sc, (v) => App.fmtN(v))}`;
  s += `<line class="median" x1="${pad.l}" x2="${W - pad.r}" y1="${y(med)}" y2="${y(med)}"/><text x="${W - pad.r + 4}" y="${y(med) + 4}">${t('median', { v: App.fmtN(Math.round(med * 1000) / 1000) })}</text>`;
  s += `<path class="line" d="${rows.map((r, i) => (i ? 'L' : 'M') + x(i) + ',' + y(r.perFile)).join(' ')}"/>`;
  rows.forEach((r, i) => { s += `<g class="col" data-open="${esc(r.id)}" data-tip="${esc(JSON.stringify([[t('perFileShort', { v: App.fmtN(Math.round(r.perFile * 1000) / 1000) }), App.htitle(r.id, r.goal)], [App.fmtDate(r.merged) + ' · ' + r.files + ' ' + t('filesN') + ' · ' + App.fmtM(r.tokensM), '']]))}">
    <rect class="hit" x="${pad.l + slot * i}" y="${pad.t}" width="${slot}" height="${H - pad.t - pad.b}"/><line class="cross" x1="${x(i)}" x2="${x(i)}" y1="${pad.t}" y2="${H - pad.b}"/>
    <circle class="dot" cx="${x(i)}" cy="${y(r.perFile)}" r="4"/></g>`;
    if (i === 0 || i === rows.length - 1 || i % Math.ceil(rows.length / 6) === 0) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${App.fmtDate(r.merged)}</text>`; });
  el.innerHTML = s + `<line x1="${pad.l}" x2="${W - pad.r}" y1="${H - pad.b}" y2="${H - pad.b}" style="stroke:var(--color-border-strong)"/></svg>`;
}
function rangeChart(el, rows) {
  rows = rows.filter((r) => r.rg).slice().reverse();
  if (!rows.length) { el.innerHTML = `<div class="subtle" style="padding:12px">${t('k_noEst')}</div>`; return; }
  const W = Math.max(el.clientWidth, 560), rowH = 26, pad = { l: 230, r: 110, t: 8, b: 26 }, H = pad.t + rows.length * rowH + pad.b;
  const sc = niceMax(Math.max(...rows.map((r) => Math.max(r.tokensM, r.rg[1])))), xs = (v) => pad.l + (W - pad.l - pad.r) * (v / sc.max);
  let s = `<svg class="viz" height="${H}" viewBox="0 0 ${W} ${H}"><g class="grid">`;
  for (let v = 0; v <= sc.max + 1e-9; v += sc.step) s += `<line x1="${xs(v)}" x2="${xs(v)}" y1="${pad.t}" y2="${H - pad.b}"/><text x="${xs(v)}" y="${H - 8}" text-anchor="middle">${App.fmtN(v)}</text>`;
  s += '</g>';
  rows.forEach((r, i) => { const cy = pad.t + i * rowH + rowH / 2, f = fit(r), d = f === 'above' ? r.tokensM - r.rg[1] : f === 'below' ? r.tokensM - r.rg[0] : 0;
    const title = App.htitle(r.id, r.goal), short = title.length > 30 ? title.slice(0, 29) + '…' : title;
    s += `<g class="col" data-open="${esc(r.id)}" data-tip="${esc(JSON.stringify([[App.fmtM(r.tokensM), title], [t('est') + ': ' + App.fmtRange(r.rg), ''], [FIT_IC[f] + ' ' + t('fit_' + f), '']]))}">
      <rect class="hit" x="0" y="${cy - rowH / 2}" width="${W}" height="${rowH}"/>
      <text x="${pad.l - 10}" y="${cy + 4}" text-anchor="end" style="fill:var(--color-text)">${esc(short)}</text>
      <rect class="band" x="${xs(r.rg[0])}" y="${cy - 5}" width="${Math.max(2, xs(r.rg[1]) - xs(r.rg[0]))}" height="10" rx="4"/>
      <circle cx="${xs(r.tokensM)}" cy="${cy}" r="5" style="fill:${f === 'in' ? 'var(--color-text)' : f === 'above' ? 'var(--st-done)' : 'var(--color-text-subtle)'};stroke:var(--color-surface);stroke-width:2"/>
      <text x="${W - pad.r + 10}" y="${cy + 4}">${FIT_IC[f]} ${f === 'in' ? t('fit_in') : (d > 0 ? '+' : '') + App.fmtM(d)}</text></g>`; });
  el.innerHTML = s + '</svg>';
}
function drawB(el) {
  const rows = measured();
  const c1 = el.querySelector('#ch1'), c2 = el.querySelector('#ch2'), c3 = el.querySelector('#ch3');
  if (c1 && rows.length) columnsChart(c1, rows);
  if (c2 && rows.length) lineChart(c2, rows);
  if (c3) rangeChart(c3, rows);
}

// tooltip: values lead, labels follow; text via textContent
const tip = document.createElement('div'); tip.id = 'ttip'; document.body.appendChild(tip);
document.addEventListener('pointermove', (e) => {
  const g = e.target.closest && e.target.closest('[data-tip]');
  if (!g) { tip.style.display = 'none'; return; }
  tip.replaceChildren(...JSON.parse(g.dataset.tip).map(([v, l], i) => { const d = document.createElement('div');
    const a = document.createElement('span'); a.className = i === 0 ? 'v' : 'l'; a.textContent = v; d.appendChild(a);
    if (l) { const b = document.createElement('div'); b.className = 'l'; b.textContent = l; d.appendChild(b); } return d; }));
  tip.style.display = 'block';
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});

App.init({
  sketch: '004 · historia i koszty', tab: 'history', tabSketch: { roadmap: '001/002', backlog: '003', decisions: '003' },
  variants: [
    { id: 'a', label: 'A: Kafelki + tabela ze słupkami', render: renderA },
    { id: 'b', label: 'B: Wykresy w czasie + trafność ceny', winner: true, render: renderB, after: (el) => requestAnimationFrame(() => drawB(el)) },
  ],
});
</script>
